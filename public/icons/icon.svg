<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Shopping Kiosk Store Icon -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Roof / Canopy -->
    <path d="M20 100 L150 20 L280 100 Z" fill="url(#accentGrad)" />
    
    <!-- Canopy stripes -->
    <path d="M50 100 L150 35 L170 35 L80 100 Z" fill="#ffffff" fill-opacity="0.25" />
    <path d="M120 100 L150 20 L160 20 L150 100 Z" fill="#ffffff" fill-opacity="0.25" />
    <path d="M190 100 L150 35 L170 35 L220 100 Z" fill="#ffffff" fill-opacity="0.25" />

    <!-- Canopy base awning -->
    <rect x="15" y="95" width="270" height="24" rx="12" fill="#38bdf8" />

    <!-- Pillars -->
    <rect x="35" y="119" width="16" height="135" rx="4" fill="#64748b" />
    <rect x="249" y="119" width="16" height="135" rx="4" fill="#64748b" />

    <!-- Store Counter -->
    <rect x="30" y="180" width="240" height="85" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    
    <!-- POS Screen on counter -->
    <rect x="110" y="130" width="80" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="116" y="136" width="68" height="40" rx="3" fill="#38bdf8" fill-opacity="0.2" />
    <!-- Stand -->
    <path d="M142 182 L158 182 L162 196 L138 196 Z" fill="#64748b" />

    <!-- QR / Barcode indicator inside counter -->
    <g transform="translate(110, 205)" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="35" />
      <line x1="8" y1="0" x2="8" y2="35" stroke-width="6" />
      <line x1="20" y1="0" x2="20" y2="35" />
      <line x1="28" y1="0" x2="28" y2="35" stroke-width="4" />
      <line x1="40" y1="0" x2="40" y2="35" stroke-width="6" />
      <line x1="52" y1="0" x2="52" y2="35" />
      <line x1="60" y1="0" x2="60" y2="35" stroke-width="5" />
      <line x1="72" y1="0" x2="72" y2="35" />
      <line x1="80" y1="0" x2="80" y2="35" stroke-width="4" />
    </g>
  </g>
</svg>
